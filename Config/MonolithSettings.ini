[/Script/MonolithCore.MonolithSettings]
; MCP server port — the embedded HTTP server listens here
ServerPort=9316

; Automatically check GitHub Releases for updates on editor startup
bAutoUpdateEnabled=false

; Override database storage path (leave empty for default: Plugins/Monolith/Saved/)
DatabasePathOverride=(Path="")

; Artifact cache identity provider: SavedHash | ARSnapshotV1
IndexIdentityProvider=SavedHash

; Shadow mode gates the new artifact path to a single cohort
bEnableArtifactShadowMode=False
ShadowModeCohort=

; Artifact cache / warmup knobs
IoDdcPoolSize=2
WarmupReleaseThreshold=90

; Module toggles — disable domains you don't need
bEnableBlueprint=True
bEnableMaterial=True
bEnableAnimation=True
bEnableNiagara=True
bEnableEditor=True
bEnableConfig=True
bEnableAudio=True
bEnableIndex=True
bEnableSource=True

; Log verbosity: 0=Silent, 1=Error, 2=Warning, 3=Log, 4=Verbose
LogVerbosity=3
